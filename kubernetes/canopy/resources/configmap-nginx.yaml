# nginx fronts the php-fpm container over the shared pod network namespace.
# The canopy image (see gpo/canopy Dockerfile) ships this same config under
# docker/nginx/default.conf but doesn't run nginx itself - keep these in sync
# until that image runs its own web server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: canopy-nginx
  labels:
    app: canopy
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        root /app/web;
        index index.php;

        client_max_body_size 64m;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
        }

        location = /healthz {
            access_log off;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index healthz.php;
            fastcgi_param SCRIPT_FILENAME /app/web/healthz.php;
            include fastcgi_params;
        }

        location ~* \.(?:css|js|map|woff2?|ttf|svg|ico)$ {
            expires 30d;
            access_log off;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
