# genk8s:hash=dbbd4878608fa3bcdb15b7459f17761e
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: canopy
  namespace: canopy
  labels:
    gateway: gpogear
spec:
  # this connects us to the gateway
  parentRefs:
  - kind: Gateway
    name: gpogear
    namespace: gateway
    sectionName: tls_gear
  hostnames:
  - "canopy.gpogear.ca"
  rules:
  - matches:
    backendRefs:
    - name: canopy
      port: 8080
