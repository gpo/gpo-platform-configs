# genk8s:hash=3408424ed9c5af7f137910db0b546cff
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: superset
  namespace: superset
  labels:
    gateway: gpotools
spec:
  # this connects us to the gateway
  parentRefs:
  - kind: Gateway
    name: gpotools
    namespace: gateway
    sectionName: tls_tools
  hostnames:
  - "superset.gpotoolsstage.ca"
  rules:
  - backendRefs:
    - name: superset
      port: 8088
