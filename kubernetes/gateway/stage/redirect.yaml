apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-tools-redirect
  namespace: gateway
spec:
  parentRefs:
  - name: gpotools
    sectionName: http-tools
  hostnames:
  - "*.gpotoolsstage.ca"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-gear-redirect
  namespace: gateway
spec:
  parentRefs:
  - name: gpotools
    sectionName: http-gear
  hostnames:
  - "*.gpogear.ca"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
