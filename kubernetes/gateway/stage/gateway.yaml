# genk8s:hash=9d95b820964a906ccd4fef949db9efc5
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gpotools
  namespace: gateway
spec:
  # this gatewayClass is the incantation for the current gen ALB (not classic)
  # https://docs.cloud.google.com/load-balancing/docs/https#load-balancer-mode
  gatewayClassName: gke-l7-global-external-managed
  listeners:
  - name: http_tools
    protocol: HTTP
    port: 80
    hostname: "*.gpotoolsstage.ca"
    allowedRoutes:
      namespaces:
        from: All
      kinds:
      - kind: HTTPRoute
  - name: tls_tools
    hostname: "*.gpotoolsstage.ca"
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: wildcard-gpotools
    allowedRoutes:
      namespaces:
        from: All
      kinds:
      - kind: HTTPRoute
  - name: http_gear
    protocol: HTTP
    port: 80
    hostname: "*.gpogear.ca"
    allowedRoutes:
      namespaces:
        from: All
      kinds:
      - kind: HTTPRoute
  - name: tls_gear
    hostname: "*.gpogear.ca"
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: wildcard-gpogear
    allowedRoutes:
      namespaces:
        from: All
      kinds:
      - kind: HTTPRoute
  addresses:
  - type: NamedAddress
    value: gke-ingress-ip
