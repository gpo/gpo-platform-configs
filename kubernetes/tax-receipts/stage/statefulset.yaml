# genk8s:hash=1852168fa71df154ddeba26c2ead0102
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tax-receipts-app
  labels:
    app: tax-receipts-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tax-receipts
  template:
    metadata:
      labels:
        app: tax-receipts
    spec:
      volumes:
      - name: data
        configMap:
          name: tax-receipts-nginx
      containers:
      - name: api
        imagePullPolicy: Always
        image: northamerica-northeast2-docker.pkg.dev/gpo-eng-stage/gpo/tax-receipts-api:staging
        envFrom:
        - configMapRef:
            name: tax-receipts-env
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tax-receipts-app
              key: uri
        readinessProbe:
          httpGet:
            path: /health
            port: http
      - name: web
        image: northamerica-northeast2-docker.pkg.dev/gpo-eng-stage/gpo/tax-receipts:staging
        env:
        - name: API_UPSTREAM
          value: http://localhost:3000
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
