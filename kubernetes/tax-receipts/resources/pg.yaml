apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tax-receipts
spec:
  instances: 1
  storage:
    size: 8Gi

  bootstrap:
    initdb:
      database: tax_receipts
      owner: gpo

  managed:
    roles:
      - name: gpo
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        passwordSecret:
          name: tax-receipts-postgres-db
